name: phasscode-platform-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: phasscode_test
    networks: [tests]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U test -d phasscode_test']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    networks: [tests]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://test:test@postgres:5432/phasscode_test
      TEST_REDIS_URL: redis://redis:6379/1
    networks: [tests]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
networks:
  tests:
