# Standalone disposable harness. Never combine this file with deployment Compose files.
services:
  postgres:
    image: postgres:17-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: synthetic
      POSTGRES_PASSWORD: synthetic
      POSTGRES_DB: phasscode_e2e
    tmpfs: [/var/lib/postgresql/data]
    networks: [e2e]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U synthetic -d phasscode_e2e']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    pull_policy: never
    command: [redis-server, --save, '', --appendonly, 'no']
    tmpfs: [/data]
    networks: [e2e]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  e2e:
    image: ${PHASSCODE_B2_RUNNER_IMAGE:?Use scripts/b2-e2e.mjs to select the owned runner image}
    pull_policy: never
    init: true
    shm_size: 1gb
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [e2e]
    environment:
      NODE_ENV: test
      GITHUB_REF_NAME: dev
      PHASSCODE_B2_DISPOSABLE: 'true'
      PHASSCODE_B2_OWNERSHIP_NONCE: ${PHASSCODE_B2_OWNERSHIP_NONCE:?Generated by the harness}
      PHASSCODE_B2_CONTROL_KEY: ${PHASSCODE_B2_CONTROL_KEY:?Generated by the harness}
      PHASSCODE_B2_REGRESSION: ${PHASSCODE_B2_REGRESSION:-false}
      PHASSCODE_B2_REGRESSION_ONLY: ${PHASSCODE_B2_REGRESSION_ONLY:-false}
      PHASSCODE_B2_FRONTEND_ONLY: ${PHASSCODE_B2_FRONTEND_ONLY:-false}
      PHASSCODE_B2_REGRESSION_SCOPE: ${PHASSCODE_B2_REGRESSION_SCOPE:-none}
      PHASSCODE_B2_TEST_GREP: ${PHASSCODE_B2_TEST_GREP:-}
      PHASSCODE_B2_FRONTEND_TEST_GREP: ${PHASSCODE_B2_FRONTEND_TEST_GREP:-}
      PHASSCODE_B2_FRONTEND_SUITES: ${PHASSCODE_B2_FRONTEND_SUITES:-}
      PHASSCODE_B2_ARTIFACTS_DIR: /app/artifacts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: [node, scripts/b2-runtime.mjs]
    restart: 'no'
    stop_grace_period: 30s
networks:
  e2e:
    internal: true
