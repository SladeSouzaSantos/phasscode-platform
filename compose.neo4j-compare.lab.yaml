# Optional, lab-only Neo4j reference for HydraDB comparison.
# NEVER attach to the DEV Neo4j, use the DEV graph-seed, or reuse its credentials.
# Explicit Compose project: phasscode-hydradb-lab. No external Docker networks.
services:
  neo4j-compare:
    image: neo4j:5.26
    profiles: [neo4j-compare]
    environment:
      NEO4J_AUTH: ${NEO4J_LAB_AUTH:?Set a fresh private NEO4J_LAB_AUTH in the LAB .env}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_server_http_enabled: 'true'
    networks: [backend]
    volumes:
      - neo4j-compare-data:/data
    ports:
      - '127.0.0.1:17474:7474'
    healthcheck:
      # Cheap TCP reachability check; no expensive cypher-shell JVM launches.
      # Authentication and query readiness are verified separately by the
      # read-only benchmark preflight (RETURN 1 via HTTP Basic auth).
      # Neo4j official Linux image includes bash; /dev/tcp is a bash builtin.
      test:
        - CMD-SHELL
        - 'bash -c "exec 3<>/dev/tcp/127.0.0.1/7474" >/dev/null 2>&1'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: 'no'
    mem_limit: 896m
    cpus: 0.75
    pids_limit: 256
    security_opt: [no-new-privileges:true]

volumes:
  neo4j-compare-data:
