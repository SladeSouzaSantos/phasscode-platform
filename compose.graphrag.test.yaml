# Disposable GraphRAG verification. Synthetic CI credential; never reuse for DEV.
name: ${COMPOSE_PROJECT_NAME:-phasscode-graphrag-ci}
services:
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/graphrag-only-ci-not-secret
    networks: [graph-ci]
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u neo4j -p graphrag-only-ci-not-secret "RETURN 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    # No published ports or durable volumes.
  tests:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: test
    command: [npm, run, test:neo4j]
    environment:
      TEST_NEO4J_URI: bolt://neo4j:7687
      TEST_NEO4J_AUTH: graphrag-only-ci-not-secret
    networks: [graph-ci]
    depends_on:
      neo4j: { condition: service_healthy }
networks:
  graph-ci:
