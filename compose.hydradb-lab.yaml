# Experimental Orbe baseline only: third isolated Compose project.
# Use ONLY with -p phasscode-hydradb-lab and the private lab .env.
# This overlay does NOT start HydraDB and does NOT connect to DEV/MAIN.
# Add HydraDB later as a separately constrained service after native verification.
services:
  postgres:
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  redis:
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 128

  migrate:
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  api:
    # Base compose.yaml already binds the port to 127.0.0.1.
    # The preflight script requires PHASSCODE_HTTP_PORT=13003.
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
