name: ${COMPOSE_PROJECT_NAME:-phasscode-platform}
x-app: &app
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
  image: ${PHASSCODE_IMAGE:-${COMPOSE_PROJECT_NAME:-phasscode-platform}:local}
  init: true
  networks: [backend]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &app-env
    NODE_ENV: ${PHASSCODE_NODE_ENV:-production}
    HOST: 0.0.0.0
    PORT: 3000
    PERSISTENCE: postgres
    DATABASE_URL: postgresql://${POSTGRES_USER:-phasscode}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env}@postgres:5432/${POSTGRES_DB:-phasscode}
    REDIS_URL: redis://redis:6379
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    TRUST_PROXY: ${TRUST_PROXY:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_MODE: ${LLM_API_MODE:-responses}
    LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-15000}
    LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-800}
    LLM_GLOBAL_MAX_CALLS: ${LLM_GLOBAL_MAX_CALLS:-}
    LLM_GLOBAL_WINDOW_MS: ${LLM_GLOBAL_WINDOW_MS:-86400000}
    LLM_GLOBAL_BUDGET_KEY: ${LLM_GLOBAL_BUDGET_KEY:-phasscode:llm:global}
    OPENROUTER_REASONING_ENABLED: ${OPENROUTER_REASONING_ENABLED:-}
    LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-false}
    LLM_FALLBACK_ATTEMPT_TIMEOUT_MS: ${LLM_FALLBACK_ATTEMPT_TIMEOUT_MS:-}
    LLM_FALLBACK_COOLDOWN_MS: ${LLM_FALLBACK_COOLDOWN_MS:-60000}
    LLM_FALLBACK_MAX_COOLDOWN_MS: ${LLM_FALLBACK_MAX_COOLDOWN_MS:-86400000}
    LLM_FALLBACK_MAX_ATTEMPTS_PER_TURN: ${LLM_FALLBACK_MAX_ATTEMPTS_PER_TURN:-6}
    LLM_OPENROUTER_API_KEY: ${LLM_OPENROUTER_API_KEY:-}
    LLM_OPENROUTER_MODEL: ${LLM_OPENROUTER_MODEL:-}
    LLM_OPENROUTER_MAX_CALLS: ${LLM_OPENROUTER_MAX_CALLS:-}
    LLM_OPENROUTER_WINDOW_MS: ${LLM_OPENROUTER_WINDOW_MS:-}
    LLM_GEMINI_API_KEY: ${LLM_GEMINI_API_KEY:-}
    LLM_GEMINI_MODEL: ${LLM_GEMINI_MODEL:-}
    LLM_GEMINI_MAX_CALLS: ${LLM_GEMINI_MAX_CALLS:-}
    LLM_GEMINI_WINDOW_MS: ${LLM_GEMINI_WINDOW_MS:-}
    LLM_GROQ_API_KEY: ${LLM_GROQ_API_KEY:-}
    LLM_GROQ_MODEL: ${LLM_GROQ_MODEL:-}
    LLM_GROQ_MAX_CALLS: ${LLM_GROQ_MAX_CALLS:-}
    LLM_GROQ_WINDOW_MS: ${LLM_GROQ_WINDOW_MS:-}
    LLM_COHERE_API_KEY: ${LLM_COHERE_API_KEY:-}
    LLM_COHERE_MODEL: ${LLM_COHERE_MODEL:-}
    LLM_COHERE_MAX_CALLS: ${LLM_COHERE_MAX_CALLS:-}
    LLM_COHERE_WINDOW_MS: ${LLM_COHERE_WINDOW_MS:-}
    CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-7}
    CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-12}
    CHAT_CONTEXT_CHARS: ${CHAT_CONTEXT_CHARS:-12000}
    RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
    RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    AUTH_ENABLED: ${AUTH_ENABLED:-false}
    AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-}
    AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-}
    AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
    AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
    AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-}
    AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
    AUTH_JWT_PREVIOUS_JWKS: ${AUTH_JWT_PREVIOUS_JWKS:-}
    AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-}
    AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-phasscode-api}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-300}
    AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-1800}
    AUTH_SESSION_MAX_SECONDS: ${AUTH_SESSION_MAX_SECONDS:-28800}
    AUTH_HTTP_TIMEOUT_SECONDS: ${AUTH_HTTP_TIMEOUT_SECONDS:-5}
    MEETINGS_ENABLED: ${MEETINGS_ENABLED:-false}
    MEETINGS_TIMEZONE: ${MEETINGS_TIMEZONE:-America/Fortaleza}
    MEETINGS_WORKDAYS: ${MEETINGS_WORKDAYS:-1,2,3,4,5,6}
    MEETINGS_WORK_START: ${MEETINGS_WORK_START:-09:00}
    MEETINGS_WORK_END: ${MEETINGS_WORK_END:-18:00}
    MEETINGS_DURATION_MINUTES: ${MEETINGS_DURATION_MINUTES:-30}
    MEETINGS_SLOT_STEP_MINUTES: ${MEETINGS_SLOT_STEP_MINUTES:-15}
    MEETINGS_MIN_NOTICE_MINUTES: ${MEETINGS_MIN_NOTICE_MINUTES:-1440}
    MEETINGS_BUFFER_MINUTES: ${MEETINGS_BUFFER_MINUTES:-15}
    MEETINGS_MAX_HORIZON_DAYS: ${MEETINGS_MAX_HORIZON_DAYS:-60}
    MEETINGS_MAX_AVAILABILITY_DAYS: ${MEETINGS_MAX_AVAILABILITY_DAYS:-7}
    MEETINGS_CONSENT_VERSION: ${MEETINGS_CONSENT_VERSION:-meetings-v1}
    MEETINGS_RETENTION_DAYS: ${MEETINGS_RETENTION_DAYS:-90}
    MEETINGS_PROPOSAL_TTL_MINUTES: ${MEETINGS_PROPOSAL_TTL_MINUTES:-30}
    MEETINGS_CALENDAR_LEASE_SECONDS: ${MEETINGS_CALENDAR_LEASE_SECONDS:-120}
    GOOGLE_CALENDAR_MODE: ${GOOGLE_CALENDAR_MODE:-disabled}
    GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
    GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
    GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
    GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
    GOOGLE_CALENDAR_HTTP_TIMEOUT_MS: ${GOOGLE_CALENDAR_HTTP_TIMEOUT_MS:-10000}
    WORKER_ENABLED: ${WORKER_ENABLED:-false}
    NOTIFICATION_MODE: ${NOTIFICATION_MODE:-disabled}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    NOTIFICATION_HTTP_TIMEOUT_MS: ${NOTIFICATION_HTTP_TIMEOUT_MS:-10000}
    OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
    OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-120000}
    OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
    REMINDER_BEFORE_MINUTES: ${REMINDER_BEFORE_MINUTES:-60}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phasscode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env}
      POSTGRES_DB: ${POSTGRES_DB:-phasscode}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *app
    command: [npm, run, migrate:prod]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  api:
    <<: *app
    ports: ['127.0.0.1:${PHASSCODE_HTTP_PORT:-3000}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
  retention:
    <<: *app
    profiles: [maintenance]
    command: [node, dist/packages/database/src/retention.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'
  worker:
    <<: *app
    profiles: [worker]
    command: [node, dist/apps/worker-node/src/main.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('node:fs');try{process.exit(Date.now()-Number(fs.readFileSync('/tmp/phasscode-worker-heartbeat','utf8'))<30000?0:1)}catch{process.exit(1)}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.75
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-phasscode}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-rabbitmq-only}
    networks: [backend]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 15s
      timeout: 10s
      retries: 10
  kafka:
    image: apache/kafka:4.1.0
    profiles: [kafka]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    networks: [backend]
    volumes: [kafka-data:/var/lib/kafka/data]
networks:
  backend:
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  kafka-data:
