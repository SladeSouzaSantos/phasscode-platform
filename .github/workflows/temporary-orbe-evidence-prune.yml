name: One-time cleanup of merged Orbe evidence branch
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-orbe-evidence-prune.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo} = context.repo;
            const target='feat/orbe-vacancy-project-evidence-20261029';
            const expected='b94243fb11086bc0b3e3662bd16467db7158b775';
            const pr=await github.rest.pulls.get({owner,repo,pull_number:20});
            if (!pr.data.merged || pr.data.base.ref!=='dev' || pr.data.head.sha!==expected)
              throw new Error('PR #20 not confirmed as safely merged.');
            const {data:r}=await github.rest.repos.get({owner,repo});
            if (r.default_branch!=='main') throw new Error('Unexpected default branch.');
            const {data:b}=await github.rest.repos.getBranch({owner,repo,branch:target});
            if (b.protected || b.commit.sha!==expected) throw new Error('Branch moved/protected.');
            const open=await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
            if (open.data.some(p=>p.head.ref===target)) throw new Error('Open PR uses branch.');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+target});
            core.info('Merged Orbe evidence branch pruned. dev/main preserved.');
