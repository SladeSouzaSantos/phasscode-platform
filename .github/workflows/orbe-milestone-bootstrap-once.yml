name: Orbe milestone bootstrap (one shot)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-milestone-bootstrap-once.yml
permissions:
  contents: read
  issues: write
jobs:
  create-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse milestone and attach issues 24 25 26
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE='Orbe — Inteligência de Evidências e Homologação (Fases 1–3)'
          DESCRIPTION='Milestone de continuidade Orbe no PHASSCODE Platform (DEV): Fase 1 recuperação/cobertura/proveniência por requisito; Fase 2 orçamento/compactação/rastreamento/validação; Fase 3 grafo, auditoria e homologação com recrutadores. Baseline release 4a50636, workflow #326 bem-sucedido (2026-11-01). Pendentes: Git, SQL, testes automatizados e anos de experiência; acompanhar os resultados nas issues #24, #25, #26. Atualizar as três issues após cada rodada, commits, Actions e testes. Nunca promover main sem homologação.'
          NUMBER="$(gh api "repos/$REPO/milestones?state=all&per_page=100" --jq '.[] | select(.title == "Orbe — Inteligência de Evidências e Homologação (Fases 1–3)") | .number' | head -n 1)"
          if [ -z "$NUMBER" ]; then
            NUMBER="$(gh api -X POST "repos/$REPO/milestones" -f title="$TITLE" -f description="$DESCRIPTION" --jq '.number')"
          fi
          for ISSUE in 24 25 26; do
            gh api -X PATCH "repos/$REPO/issues/$ISSUE" -F milestone="$NUMBER" > /dev/null
          done
          echo "Milestone: https://github.com/$REPO/milestone/$NUMBER"
          echo "Issues linked: #24, #25, #26"
