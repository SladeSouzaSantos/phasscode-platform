name: One-time F3.7 lexical baseline validate and format
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-lexical-validate-once.yml
permissions:
  contents: write
jobs:
  lexical-baseline:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format scoped F3.7 baseline files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            package.json \
            evaluation/semantic-hybrid-lexical-baseline.ts \
            scripts/evaluate-semantic-lexical.ts \
            tests/semantic-hybrid-lexical-baseline.test.ts \
            docs/architecture/semantic-lexical-baseline-f37.md
          git diff --check
      - name: Test TypeScript and focused corpus regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx vitest run \
            tests/semantic-hybrid-lexical-baseline.test.ts \
            tests/semantic-hybrid-coverage-report.test.ts \
            tests/semantic-hybrid-corpus.test.ts
      - name: Evaluate with zero LLM and graph queries
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/audit-semantic-hybrid-coverage.ts > /tmp/f37-coverage.json
          node --import tsx scripts/evaluate-semantic-lexical.ts > /tmp/f37-lexical.json
          node -e '
            const fs = require("node:fs");
            const c = JSON.parse(fs.readFileSync("/tmp/f37-coverage.json", "utf8"));
            const r = JSON.parse(fs.readFileSync("/tmp/f37-lexical.json", "utf8"));
            if (c.totals.cases !== 9 || c.totals.reviewedSpans !== 56) process.exit(1);
            if (r.totals.cases !== 16 || r.totals.spans !== 31) process.exit(1);
            if (r.modelCalls !== 0 || r.graphQueries !== 0 || r.vectorQueries !== 0) process.exit(1);
            console.log("F37_CORPUS_AUDIT cases=" + c.totals.cases +
              " spans=" + c.totals.reviewedSpans + " unresolved=" + c.totals.uninterpretedSegments);
            console.log("F37_LEXICAL_BASELINE", JSON.stringify(r.totals));
          '
      - name: Commit only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            evaluation/semantic-hybrid-lexical-baseline.ts \
            scripts/evaluate-semantic-lexical.ts \
            tests/semantic-hybrid-lexical-baseline.test.ts \
            docs/architecture/semantic-lexical-baseline-f37.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(F3.7): apply pinned Prettier to lexical reference (#42)'
            git push origin HEAD:dev
          fi

# Re-run after fixing the source-offset test fixture; delete this workflow when green.
