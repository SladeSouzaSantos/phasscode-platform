name: One-time F3.7 ONNX Prettier correction
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-onnx-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prettier format only F3.7 files identified by CI
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            evaluation/semantic-embedding-paraphrase-v0.json \
            evaluation/semantic-skill-catalog.ts
          git diff --check
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/semantic-embedding-paraphrase-v0.json evaluation/semantic-skill-catalog.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(F3.7): normalize ONNX challenge corpus and skill exporter (#42)'
            git push origin HEAD:dev
          fi
