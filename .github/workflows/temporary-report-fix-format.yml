name: Temporary reporter formatting
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-report-fix-format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/report-node/src/main.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/report-node/src/main.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(orbe): format reporter shutdown handling'
            git push origin HEAD:dev
          fi
