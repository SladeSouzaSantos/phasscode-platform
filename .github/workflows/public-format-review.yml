name: Temporary public Orbe formatting review
on:
  pull_request:
    branches: [dev]
    paths:
      - 'knowledge/portfolio.json'
      - 'apps/orbe-node/prompts/v4.md'
      - '.github/workflows/public-format-review.yml'
permissions:
  contents: read
jobs:
  format-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Format content and expose fixture for reviewed PR
        run: |
          for file in knowledge/portfolio.json apps/orbe-node/prompts/v4.md; do
            npx prettier --write "$file"
            printf 'BEGIN_FORMAT:%s\n' "$file"
            base64 -w0 "$file"
            printf '\nEND_FORMAT\n'
          done
