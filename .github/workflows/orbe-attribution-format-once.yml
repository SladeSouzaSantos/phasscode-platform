name: Orbe academic attribution formatter once
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-attribution-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format revised academic and evidence audit modules
        run: |
          npx prettier --write \
            apps/orbe-node/src/adapters/academic.ts \
            apps/orbe-node/src/application/sources.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            tests/ppks-academic.test.ts \
            tests/evidence-packet.test.ts
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/adapters/academic.ts apps/orbe-node/src/application/sources.ts apps/orbe-node/src/adapters/langchain-provider.ts tests/ppks-academic.test.ts tests/evidence-packet.test.ts
          git commit -m "style(orbe): format structured courses and recruiter attribution audit"
          git push origin HEAD:dev
