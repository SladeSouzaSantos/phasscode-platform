name: Orbe PPKS security evidence format (one shot)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-security-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply project formatting to security evidence changes
        run: |
          npx prettier --write \
            apps/orbe-node/src/knowledge-matching.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            apps/orbe-node/src/application/evidence-packet.ts \
            knowledge/portfolio.json \
            tests/evidence-packet.test.ts \
            tests/llm-adapter.test.ts
      - name: Commit only formatter changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/knowledge-matching.ts apps/orbe-node/src/adapters/langchain-provider.ts apps/orbe-node/src/application/evidence-packet.ts knowledge/portfolio.json tests/evidence-packet.test.ts tests/llm-adapter.test.ts
          git commit -m "style(ppks): format security evidence retention changes"
          git push origin HEAD:dev
