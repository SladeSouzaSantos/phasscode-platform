name: One-time Orbe recruiter formatter
on:
  push:
    branches: [feat/orbe-recruiter-profile-sources-20261029]
    paths:
      - .github/workflows/temporary-format-orbe-recruiter.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only changed Orbe files
        run: |
          npx prettier --write \
            apps/orbe-node/prompts/v4.md \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/src/application/sources.ts \
            knowledge/SOURCES.md \
            tests/knowledge-relevance.test.ts \
            tests/orbe-professional.test.ts
      - name: Commit formatted files to this PR branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/orbe-node/prompts/v4.md \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/src/application/sources.ts \
            knowledge/SOURCES.md \
            tests/knowledge-relevance.test.ts \
            tests/orbe-professional.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(orbe): normalize recruiter evidence formatting'
            git push origin HEAD:refs/heads/feat/orbe-recruiter-profile-sources-20261029
          fi
