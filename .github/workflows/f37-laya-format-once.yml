name: One-time F3.7 Laya documentation Prettier
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-laya-format-once.yml
permissions:
  contents: write
jobs:
  formatting:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only F3.7 new docs and Laya manifest
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write docs/architecture/semantic-laya-typed-decisions-f37.md evaluation/semantic-laya-manifest-v0.json
          git diff --check
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/semantic-laya-typed-decisions-f37.md evaluation/semantic-laya-manifest-v0.json
          if ! git diff --cached --quiet; then
            git commit -m 'style(F3.7): format Laya PoC manifest and ADR (#43)'
            git push origin HEAD:dev
          fi
