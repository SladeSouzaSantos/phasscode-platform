name: Temporary Orbe curated-evidence normalization
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-orbe-format.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Normalize audited files only
        run: |
          npx prettier --write \
            apps/orbe-node/prompts/v4.md \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/src/application/public-evidence.ts \
            knowledge/portfolio.json \
            tests/orbe-recruiter-scenarios.test.ts \
            docs/orbe/evidence-index.md
          git diff --check
      - name: Commit formatting to dev
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/orbe-node/prompts/v4.md apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/application/public-evidence.ts knowledge/portfolio.json tests/orbe-recruiter-scenarios.test.ts docs/orbe/evidence-index.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(orbe): normalize verified evidence and recruiter tests'
            git push origin HEAD:dev
          fi
