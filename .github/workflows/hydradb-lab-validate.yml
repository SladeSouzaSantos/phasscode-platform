name: HydraDB LAB | offline and approved MiniMac SHADOW

# Experimental branch only. A new workflow is triggered by push;
# workflow_dispatch requires the file on the GitHub default branch.
on:
  push:
    branches: [experiment/hydradb]
    paths:
      - .github/workflows/hydradb-lab-validate.yml
      - scripts/hydradb-lab-*
      - tests/hydradb-lab-*
      - knowledge/evaluations/hydradb-gate8-recruiter.json
      - knowledge/ppks/**
      - apps/orbe-node/src/adapters/ppks-evidence-graph.ts
      - apps/orbe-node/src/domain/evidence-graph.ts
      - apps/orbe-node/src/application/graph-requirements.ts
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydradb-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/experiment/hydradb'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require only the experimental repository and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SladeSouzaSantos/phasscode-platform"
          test "$GITHUB_REF" = "refs/heads/experiment/hydradb"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare disposable synthetic LAB context
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B experiment/hydradb "$GITHUB_SHA"
          umask 077
          printf '%s\n' \
            'COMPOSE_PROJECT_NAME=phasscode-hydradb-lab' \
            'PHASSCODE_HTTP_PORT=13003' \
            'ORBE_GRAPHRAG_MODE=off' > .env
          chmod 600 .env
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Dependencies with lifecycle scripts disabled
        run: npm ci --ignore-scripts
      - name: Typecheck and Gate 8 OFF reference tests (no LLM)
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          ./node_modules/.bin/vitest run \
            tests/hydradb-lab-evidence-adapter.test.ts \
            tests/hydradb-lab-gate8-score.test.ts
          node --import tsx scripts/hydradb-lab-gate8-corpus-check.ts
          node --import tsx scripts/hydradb-lab-gate8-evaluate.ts --mode off
          echo HYDRADB_LAB_CI_OFF_PASS

  minimac-shadow:
    # No SSH unless the operator explicitly enables this dedicated variable.
    needs: offline
    if: github.event_name == 'push' && github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/experiment/hydradb' && vars.HYDRADB_LAB_REMOTE_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Require dedicated LAB SSH secrets (not production deploy keys)
        shell: bash
        env:
          LAB_SSH_KEY: ${{ secrets.HYDRADB_LAB_SSH_PRIVATE_KEY }}
          LAB_KNOWN_HOSTS: ${{ secrets.HYDRADB_LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$LAB_SSH_KEY"
          test -n "$LAB_KNOWN_HOSTS"
          test "$GITHUB_REPOSITORY" = SladeSouzaSantos/phasscode-platform
          test "$GITHUB_REF" = refs/heads/experiment/hydradb
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tailscale connection via existing authorized CI identity
        uses: ./.github/actions/tailscale-connect
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ vars.TAILSCALE_TAGS || 'tag:ci' }}
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Connect with forced-command LAB key and pinned host public key
        shell: bash
        env:
          LAB_SSH_KEY: ${{ secrets.HYDRADB_LAB_SSH_PRIVATE_KEY }}
          LAB_KNOWN_HOSTS: ${{ secrets.HYDRADB_LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SladeSouzaSantos/phasscode-platform
          test "$GITHUB_REF" = refs/heads/experiment/hydradb
          test -n "$LAB_SSH_KEY"
          test -n "$LAB_KNOWN_HOSTS"
          trap 'rm -f "$RUNNER_TEMP/hydradb-lab-identity" "$RUNNER_TEMP/hydradb-lab-known-hosts"' EXIT
          umask 077
          printf '%s\n' "$LAB_SSH_KEY" > "$RUNNER_TEMP/hydradb-lab-identity"
          printf '%s\n' "$LAB_KNOWN_HOSTS" > "$RUNNER_TEMP/hydradb-lab-known-hosts"
          chmod 600 "$RUNNER_TEMP/hydradb-lab-identity" "$RUNNER_TEMP/hydradb-lab-known-hosts"
          grep -q '^100[.]116[.]88[.]73 ssh-ed25519 ' "$RUNNER_TEMP/hydradb-lab-known-hosts"
          # SSH_ORIGINAL_COMMAND must be exactly this 40-char commit SHA;
          # OpenSSH restrict,command= on the MiniMac rejects all other requests.
          ssh -F /dev/null -T \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ForwardAgent=no \
            -o ClearAllForwardings=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/hydradb-lab-known-hosts" \
            -o ConnectTimeout=12 \
            -i "$RUNNER_TEMP/hydradb-lab-identity" \
            phass@100.116.88.73 "$GITHUB_SHA"
          echo HYDRADB_LAB_CI_REMOTE_PASS
