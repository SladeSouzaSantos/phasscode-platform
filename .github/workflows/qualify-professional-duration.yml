name: Qualify F3.4 programming tenure
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/qualify-professional-duration.yml
permissions:
  contents: write
jobs:
  format-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only F3.4 changed application/test files
        run: |
          npx prettier --write             apps/orbe-node/src/domain/experience.ts             apps/orbe-node/src/application/experience-context.ts             apps/orbe-node/src/application/experience-response.ts             apps/orbe-node/src/application/chat.ts             tests/orbe-professional-duration.test.ts
      - name: Verify full application (no remote deploy)
        run: npm run check
      - name: Commit formatting only on dev
        run: |
          git add --             apps/orbe-node/src/domain/experience.ts             apps/orbe-node/src/application/experience-context.ts             apps/orbe-node/src/application/experience-response.ts             apps/orbe-node/src/application/chat.ts             tests/orbe-professional-duration.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(orbe): format professional tenure evidence adjustments (#31)'
            git push origin HEAD:dev
          fi
