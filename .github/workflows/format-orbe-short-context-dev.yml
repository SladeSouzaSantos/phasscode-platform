name: Format Orbe short-context regression (DEV one-time)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/format-orbe-short-context-dev.yml

permissions:
  contents: write

jobs:
  format-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only changed recruiter files
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/application/experience-context.ts \
            apps/orbe-node/src/application/technology-follow-up.ts \
            tests/orbe-professional-duration.test.ts
      - name: Validate all checks before committing
        run: npm run check
      - name: Commit formatting only to DEV
        run: |
          git add -- \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/application/experience-context.ts \
            apps/orbe-node/src/application/technology-follow-up.ts \
            tests/orbe-professional-duration.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'style(orbe): format short-context regression (#31)'
            git push origin HEAD:dev
          fi
