name: One-time F3.7 enriched ONNX ablation
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-embedding-glossary-once.yml
permissions:
  contents: write
concurrency:
  group: f37-embedding-glossary-once
  cancel-in-progress: true
jobs:
  enriched-vs-labels:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project dependencies and normalize curated glossary
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write evaluation/semantic-skill-descriptions-v0.json
          git diff --check
          npm run typecheck
          python3 -m unittest discover -s tests -p test_semantic_embedding_lab.py -v
      - name: Export PPKS-only public skill catalog and lexical challenge
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/export-semantic-skill-catalog.ts > "$RUNNER_TEMP/catalog.json"
          node --import tsx scripts/evaluate-semantic-lexical.ts --paraphrase-challenge > "$RUNNER_TEMP/lexical.json"
          python3 - <<'PY'
          import json, os
          catalog = json.load(open(os.environ["RUNNER_TEMP"]+"/catalog.json"))
          assert len(catalog["skills"]) == 68
          print("F37_CATALOG_LABELS="+str(len(catalog["skills"])))
          PY
      - name: Download only model artifacts pinned with checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semantic-model"
          python3 scripts/semantic_embedding_lab.py prepare --model-dir "$RUNNER_TEMP/semantic-model" > "$RUNNER_TEMP/prepared.json"
          python3 scripts/semantic_embedding_lab.py verify --model-dir "$RUNNER_TEMP/semantic-model" > "$RUNNER_TEMP/verified.json"
          echo F37_EMBEDDING_SHA256_VERIFIED
      - name: Build sandboxed lab image
        run: docker build -f infrastructure/docker/Dockerfile.semantic-embedding-lab -t orbe-f37-onnx-lab:ablation .
      - name: Compare same paraphrases and same PPKS skills without network
        shell: bash
        run: |
          set -euo pipefail
          for MODE in labels enriched; do
            ARGS=()
            if [ "$MODE" = enriched ]; then
              ARGS+=(--descriptions /lab/descriptions.json)
            fi
            docker run --rm --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --cpus 2 --memory 2g --pids-limit 128 \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$RUNNER_TEMP/semantic-model,dst=/models,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/catalog.json,dst=/lab/catalog.json,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/lexical.json,dst=/lab/lexical.json,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/evaluation/semantic-embedding-paraphrase-v0.json,dst=/lab/challenge.json,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/evaluation/semantic-skill-descriptions-v0.json,dst=/lab/descriptions.json,readonly" \
              orbe-f37-onnx-lab:ablation benchmark \
              --model-dir /models --catalog /lab/catalog.json --corpus /lab/challenge.json \
              --lexical-report /lab/lexical.json "${ARGS[@]}" \
              > "$RUNNER_TEMP/embedding-$MODE.json"
          done
          python3 - <<'PY'
          import json, os
          root=os.environ["RUNNER_TEMP"]
          a=json.load(open(root+"/embedding-labels.json"))
          b=json.load(open(root+"/embedding-enriched.json"))
          x,y=a["totals"],b["totals"]
          assert a["indexMode"]=="label_only" and b["indexMode"]=="label_plus_curated_draft_description"
          assert a["curatedDescriptionCount"]==0 and b["curatedDescriptionCount"]>=20
          assert (x["cases"],x["skills"],x["expectedInCatalog"],x["expectedOutOfCatalog"]) == (y["cases"],y["skills"],y["expectedInCatalog"],y["expectedOutOfCatalog"])
          assert x["cases"] == 18 and x["skills"] == 68
          assert a["networkCallsDuringBenchmark"] == b["networkCallsDuringBenchmark"] == 0
          for name,report in [("labels",a),("descriptions",b)]:
            t=report["totals"]
            print("F37_EMBEDDING_ABLATION",json.dumps({
              "mode":name,"cases":t["cases"],"known":t["expectedInCatalog"],
              "outOfCatalog":t["expectedOutOfCatalog"],"recallAt1":t["recallAt1"],
              "recallAt3":t["recallAt3"],"recallAt5":t["recallAt5"],
              "mrr":t["mrrFirstKnown"],"wrongTop1":t["top1NotInExpectedLabel"],
              "descriptions":report["curatedDescriptionCount"],"rssMiB":report["resource"]["peakRssMiB"],
            },separators=(",",":")))
          PY
      - name: Upload aggregate metric files, never weights
        uses: actions/upload-artifact@v4
        with:
          name: f37-descriptions-ablation-aggregates
          path: |
            ${{ runner.temp }}/embedding-labels.json
            ${{ runner.temp }}/embedding-enriched.json
          retention-days: 7
          if-no-files-found: error
      - name: Commit only pinned Prettier formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/semantic-skill-descriptions-v0.json
          if ! git diff --cached --quiet; then
            git commit -m 'style(F3.7): format curated tech glossary (#42)'
            git push origin HEAD:dev
          fi
