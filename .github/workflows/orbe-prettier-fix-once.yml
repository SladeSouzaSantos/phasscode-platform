name: DEV one-time prettier fix
on:
  push:
    branches: [dev]
    paths: [.github/workflows/orbe-prettier-fix-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/orbe-node/src/adapters/knowledge.ts tests/domain.test.ts
      - run: |
          git add apps/orbe-node/src/adapters/knowledge.ts tests/domain.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(orbe): formatar recuperação de cursos e testes"
          git push origin HEAD:dev
