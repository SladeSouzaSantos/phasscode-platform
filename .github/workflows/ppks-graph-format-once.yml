name: PPKS semantic graph formatting (one shot)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ppks-graph-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only semantic graph files
        run: |
          npx prettier --write \
            apps/orbe-node/src/adapters/semantic-graph.ts \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            apps/orbe-node/src/domain/ports.ts \
            scripts/ppks.mjs \
            tests/semantic-graph.test.ts \
            knowledge/ppks/semantic-relations.json \
            knowledge/ppks/schemas/semantic-relations-v1.schema.json \
            knowledge/ppks/SEMANTIC-RELATIONS.md
      - name: Commit formatter-only differences
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/adapters/semantic-graph.ts apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/adapters/langchain-provider.ts apps/orbe-node/src/domain/ports.ts scripts/ppks.mjs tests/semantic-graph.test.ts knowledge/ppks/semantic-relations.json knowledge/ppks/schemas/semantic-relations-v1.schema.json knowledge/ppks/SEMANTIC-RELATIONS.md
          git commit -m "style(ppks): format semantic skill graph"
          git push origin HEAD:dev
