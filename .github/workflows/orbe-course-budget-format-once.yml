name: Orbe compact courses formatter once
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-course-budget-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/orbe-node/src/application/evidence-packet.ts tests/evidence-packet.test.ts
      - name: Commit format if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/application/evidence-packet.ts tests/evidence-packet.test.ts
          git commit -m "style(orbe): format compact course evidence"
          git push origin HEAD:dev
