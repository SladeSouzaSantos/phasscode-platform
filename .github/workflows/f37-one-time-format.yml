name: One-time F3.7 Prettier format
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-one-time-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only F3.7 files with locked project Prettier
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            docs/architecture/semantic-hybrid-f37.md \
            evaluation/semantic-hybrid-corpus-v0.json \
            evaluation/semantic-hybrid-ppks-review-v0.json \
            evaluation/semantic-hybrid-coverage-report.ts \
            scripts/audit-semantic-hybrid-coverage.ts \
            tests/semantic-hybrid-corpus.test.ts \
            tests/semantic-hybrid-coverage-report.test.ts
          git diff --check
      - name: Commit only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/architecture/semantic-hybrid-f37.md \
            evaluation/semantic-hybrid-corpus-v0.json \
            evaluation/semantic-hybrid-ppks-review-v0.json \
            evaluation/semantic-hybrid-coverage-report.ts \
            scripts/audit-semantic-hybrid-coverage.ts \
            tests/semantic-hybrid-corpus.test.ts \
            tests/semantic-hybrid-coverage-report.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(F3.7): apply locked Prettier to semantic corpus and audit (#41)'
            git push origin HEAD:dev
          fi
