name: One-time format Orbe public evidence PR
on:
  push:
    branches: [feat/orbe-vacancy-project-evidence-20261029]
    paths: ['.github/workflows/temporary-format-vacancy-orbe.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: true }
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply project Prettier formatting
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/application/public-evidence.ts \
            apps/orbe-node/src/http/app.ts \
            apps/orbe-node/prompts/v4.md \
            tests/public-evidence.test.ts
      - name: Commit only formatting changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbe-node/src/application/chat.ts apps/orbe-node/src/application/public-evidence.ts apps/orbe-node/src/http/app.ts apps/orbe-node/prompts/v4.md tests/public-evidence.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(orbe): normalize public evidence formatting'
            git push origin HEAD:refs/heads/feat/orbe-vacancy-project-evidence-20261029
          fi
