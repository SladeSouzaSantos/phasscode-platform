name: One-time F3.7 Laya multilingual typed classification lab
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-laya-multilingual-once.yml
permissions:
  contents: read
concurrency:
  group: f37-laya-multilingual-once
  cancel-in-progress: true
jobs:
  typed-decisions:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate fixture and decision guardrails WITHOUT model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_laya_semantic_lab.py -v
          python3 scripts/laya_semantic_lab.py dry-run --model-dir "$RUNNER_TEMP/unused" --max-spans 16
      - name: Build sandbox CPU-only Laya image without weights
        shell: bash
        run: |
          set -euo pipefail
          docker build -f infrastructure/docker/Dockerfile.semantic-laya-lab -t orbe-f37-laya-lab:ephemeral .
      - name: Download Laya pinned checkpoint and verify both SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/laya-model"
          docker run --rm --cpus 2 --memory 5g \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HF_HOME=/models/.huggingface \
            -e HOME=/tmp \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,src=$RUNNER_TEMP/laya-model,dst=/models" \
            orbe-f37-laya-lab:ephemeral prepare --model-dir /models \
            > "$RUNNER_TEMP/laya-prepare.json"
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/laya-model,dst=/models,readonly" \
            orbe-f37-laya-lab:ephemeral verify --model-dir /models \
            > "$RUNNER_TEMP/laya-verify.json"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/laya-verify.json"))
          assert p["status"]=="LAYA_VERIFY_SHA256_OK"
          assert len(p["checksums"])==2
          print("F37_LAYA_CHECKPOINT_PINNED_AND_VERIFIED")
          PY
      - name: Infer only synthetic clauses with no network or service secrets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cpus 2 --memory 5g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HF_HOME=/tmp/hf -e HOME=/tmp -e XDG_CACHE_HOME=/tmp/cache \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            -e USE_TF=0 -e TOKENIZERS_PARALLELISM=false \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,src=$RUNNER_TEMP/laya-model,dst=/models,readonly" \
            orbe-f37-laya-lab:ephemeral benchmark \
            --model-dir /models --max-spans 16 \
            > "$RUNNER_TEMP/laya-report.json"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/laya-report.json"))
          assert p["reportVersion"]=="laya-typed-decision-lab-v0"
          assert p["metrics"]["examples"]==16
          assert p["externalLlmCalls"]==p["graphQueries"]==p["networkCallsDuringBenchmark"]==0
          print("F37_LAYA_TYPED_LAB_RESULT",json.dumps({
            "examples":p["metrics"]["examples"],
            "roleAccuracy":p["metrics"]["roleAccuracy"],
            "relationAccuracy":p["metrics"]["relationAccuracy"],
            "diagnosticAbstentions":p["metrics"]["diagnosticAbstentions"],
            "incorrectDespiteHighConfidence":p["metrics"]["incorrectDespiteHighConfidence"],
            "modelLoadMs":p["modelLoadMs"],
            "p95Ms":p["metrics"]["latencyMs"]["p95"],
            "rssMiB":p["peakRssMiB"],
            "calibration":p["calibrationStatus"],
          },separators=(",",":")))
          PY
      - name: Upload synthetic aggregate results only; never model weights
        uses: actions/upload-artifact@v4
        with:
          name: f37-laya-synthetic-aggregate
          path: ${{ runner.temp }}/laya-report.json
          retention-days: 7
          if-no-files-found: error
