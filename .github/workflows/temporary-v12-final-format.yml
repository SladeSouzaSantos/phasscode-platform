name: Temporary PPKS v1.2 final formatter
on:
  push:
    branches: [dev]
    paths: [.github/workflows/temporary-v12-final-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/orbe-node/src/adapters/knowledge.ts scripts/evaluate-orbe.ts tests/ppks-academic.test.ts evaluation/vacancies-ppks-v12.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbe-node/src/adapters/knowledge.ts scripts/evaluate-orbe.ts tests/ppks-academic.test.ts evaluation/vacancies-ppks-v12.json
          if ! git diff --cached --quiet; then
            git commit -m 'style(ppks): format recruiter evaluation and bounded evidence'
            git push origin HEAD:dev
          fi
