name: DEV one-time format curation
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/format-orbe-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format updated sources and test files
        run: |
          npx prettier --write \
            knowledge/portfolio.json knowledge/README.md knowledge/SOURCES.md \
            apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/prompts/v4.md \
            scripts/evaluate-orbe.ts evaluation/recruiter-cases.json \
            tests/orbe-recruiter-scenarios.test.ts README.md
      - name: Commit formatting to DEV only
        run: |
          git add knowledge/portfolio.json knowledge/README.md knowledge/SOURCES.md \
            apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/prompts/v4.md \
            scripts/evaluate-orbe.ts evaluation/recruiter-cases.json \
            tests/orbe-recruiter-scenarios.test.ts README.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "style(orbe): formatar curadoria e testes"
          git push origin HEAD:dev
