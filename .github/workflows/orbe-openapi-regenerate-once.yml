name: Orbe OpenAPI regeneration once
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-openapi-regenerate-once.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run contracts:generate
      - run: npx prettier --write packages/contracts/openapi.json
      - name: Commit changed OpenAPI if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/openapi.json
          git commit -m "docs(openapi): sync response schema for unbounded LLM output"
          git push origin HEAD:dev
