name: PPKS v1.3 format once
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ppks-v13-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only modified PPKS v1.3 sources
        run: |
          npx prettier --write \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            apps/orbe-node/src/application/experience-context.ts \
            apps/orbe-node/src/application/sources.ts \
            evaluation/evaluator.ts \
            evaluation/vacancies-ppks-v12.json \
            tests/llm-adapter.test.ts \
            tests/ppks-academic.test.ts
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/adapters/langchain-provider.ts apps/orbe-node/src/application/experience-context.ts apps/orbe-node/src/application/sources.ts evaluation/evaluator.ts evaluation/vacancies-ppks-v12.json tests/llm-adapter.test.ts tests/ppks-academic.test.ts
          git commit -m "style(ppks): format v1.3 code with repository Prettier"
          git push origin HEAD:dev
