name: PPKS v1.3 one-shot formatter
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ppks-v13-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only changed PPKS implementation
        run: |
          npx prettier --write \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/src/application/sources.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            evaluation/schema.ts \
            evaluation/runner.ts \
            evaluation/evaluator.ts \
            tests/ppks-functional-v13.test.ts \
            tests/evaluation.test.ts
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/application/sources.ts apps/orbe-node/src/adapters/langchain-provider.ts evaluation/schema.ts evaluation/runner.ts evaluation/evaluator.ts tests/ppks-functional-v13.test.ts tests/evaluation.test.ts
          git commit -m "style(ppks): format completed functional corrections"
          git push origin HEAD:dev
