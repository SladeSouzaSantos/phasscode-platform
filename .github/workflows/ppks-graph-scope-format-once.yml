name: PPKS graph scope format once
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ppks-graph-scope-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/orbe-node/src/adapters/semantic-graph.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/adapters/semantic-graph.ts
          git commit -m "style(ppks): format semantic evidence scope"
          git push origin HEAD:dev
