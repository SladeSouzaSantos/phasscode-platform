name: Qualify Java tenure regression (DEV only)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/qualify-java-tenure-dev.yml

permissions:
  contents: write

jobs:
  format-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only changed Java duration guard and test
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/experience-context.ts \
            tests/orbe-professional-duration.test.ts
      - name: Verify complete backend without remote deployment
        run: npm run check
      - name: Commit formatting on DEV
        run: |
          git add -- \
            apps/orbe-node/src/application/experience-context.ts \
            tests/orbe-professional-duration.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'style(orbe): format Java tenure regression (#31)'
            git push origin HEAD:dev
          fi
