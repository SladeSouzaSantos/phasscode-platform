name: Temporary report contracts regeneration
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-report-contracts.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: true}
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run contracts:generate
      - name: Commit generated OpenAPI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/contracts/openapi.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(api): regenerate Orbe report consent OpenAPI'
            git push origin HEAD:dev
          fi
