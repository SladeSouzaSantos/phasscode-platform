# Temporary DEV-only qualification; remove after success.
name: Qualify F3.3 shared turn budget
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graph-turn-budget-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply canonical repository formatter
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/graph-turn-llm-budget.ts \
            tests/graph-turn-llm-budget.test.ts \
            docs/graph-rag-f3-3.md
      - name: Check code and F3.3 budget regressions
        run: |
          npm run lint
          npm run typecheck
          npx vitest run \
            tests/graph-turn-llm-budget.test.ts \
            tests/graph-semantic-vacancy.test.ts \
            tests/graph-vacancy-coverage.test.ts \
            tests/graph-vacancy-text.test.ts \
            tests/graph-recruiter-preview.test.ts \
            tests/llm-fallback.test.ts \
            tests/llm-invocation-controller.test.ts
      - name: Commit qualified formatting to DEV only
        run: |
          git add -- \
            apps/orbe-node/src/application/graph-turn-llm-budget.ts \
            tests/graph-turn-llm-budget.test.ts \
            docs/graph-rag-f3-3.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(graphrag): qualify shared model-call budget (#30)'
            git push origin HEAD:dev
          fi
