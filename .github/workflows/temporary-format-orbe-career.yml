name: One-time Orbe career formatter
on:
  push:
    branches: [fix/orbe-career-project-answers-20261029]
    paths: ['.github/workflows/temporary-format-orbe-career.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: true }
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply project Prettier formatting only to changed files
        run: |
          npx prettier --write \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/prompts/v4.md \
            tests/orbe-professional.test.ts
      - name: Commit formatting corrections
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/application/chat.ts apps/orbe-node/prompts/v4.md tests/orbe-professional.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(orbe): format career evidence source changes'
            git push origin HEAD:refs/heads/fix/orbe-career-project-answers-20261029
          fi
