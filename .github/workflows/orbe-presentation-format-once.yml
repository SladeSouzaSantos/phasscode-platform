name: Orbe positive presentation formatter one shot
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-presentation-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only response policy changes
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/professional-response-policy.ts \
            apps/orbe-node/src/application/sources.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            tests/orbe-presentation-policy.test.ts
      - name: Commit formatter result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/application/professional-response-policy.ts apps/orbe-node/src/application/sources.ts apps/orbe-node/src/adapters/langchain-provider.ts tests/orbe-presentation-policy.test.ts
          git commit -m "style(orbe): format intent-aware recruiter communication"
          git push origin HEAD:dev
