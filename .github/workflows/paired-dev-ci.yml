name: Backend paired DEV CI | isolated B2/F3 (no release)
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-paired-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired_dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: paired/backend
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: SladeSouzaSantos/web-portfolio-v2
          ref: dev
          path: paired/frontend
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record DEV pair snapshots (NOT release authorization)
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SladeSouzaSantos/phasscode-platform
          test "$GITHUB_REF" = refs/heads/dev
          test "$(git -C paired/backend rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C paired/backend status --porcelain)"
          test -z "$(git -C paired/frontend status --porcelain)"
          git -C paired/backend checkout -B dev
          git -C paired/frontend checkout -B dev
          {
            echo "Disposable CI only. No approved pair, digest, production or Mac Mini publication."
            echo "backend_SHA=$(git -C paired/backend rev-parse HEAD)"
            echo "frontend_SHA=$(git -C paired/frontend rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked backend harness without lifecycle scripts
        working-directory: paired/backend
        run: npm ci --ignore-scripts
      - name: Verify isolated B2 harness policy
        working-directory: paired/backend
        run: node node_modules/vitest/vitest.mjs run tests/b2-harness.test.ts --pool threads --maxWorkers 1
      - name: Preload allowlisted images on disposable local Docker only
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: default
        run: |
          set -euo pipefail
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = "unix:///var/run/docker.sock"
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
          test "$(docker image inspect postgres:17-alpine --format '{{.Os}}')" = linux
          test "$(docker image inspect redis:7-alpine --format '{{.Os}}')" = linux
      - name: Complete unfiltered DEV B2/F3 using recorded local snapshots
        working-directory: paired/backend
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: default
        run: npm run test:e2e -- --frontend ../frontend --regression
