name: Temporary PPKS index generation and format # retry evidence regression fixes
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-ppks-index.yml']
permissions:
  contents: write
jobs:
  ppks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate and validate PPKS
        run: |
          npm run ppks:index
          npm run ppks:check
          npx prettier --write knowledge/ppks apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/adapters/ppks.ts scripts/ppks.mjs tests/ppks.test.ts tests/evaluation-context.test.ts package.json
          npm run ppks:check
          git diff --check
      - name: Verify TypeScript and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- knowledge/ppks apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/adapters/ppks.ts scripts/ppks.mjs tests/ppks.test.ts tests/evaluation-context.test.ts package.json
          if ! git diff --cached --quiet; then
            git commit -m 'style(ppks): generate verified index and format technical cards'
            git push origin HEAD:dev
          fi
