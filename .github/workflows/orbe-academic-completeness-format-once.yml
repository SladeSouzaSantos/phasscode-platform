name: Orbe academic completeness formatter once
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-academic-completeness-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only changed academic/evidence modules
        run: |
          npx prettier --write \
            apps/orbe-node/src/adapters/academic.ts \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/src/domain/ports.ts \
            apps/orbe-node/src/application/academic-response.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/application/sources.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            tests/orbe-academic-completeness.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/adapters/academic.ts apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/domain/ports.ts apps/orbe-node/src/application/academic-response.ts apps/orbe-node/src/application/chat.ts apps/orbe-node/src/application/sources.ts apps/orbe-node/src/adapters/langchain-provider.ts tests/orbe-academic-completeness.test.ts
          git commit -m "style(orbe): format complete academic response and evidence safeguards"
          git push origin HEAD:dev
