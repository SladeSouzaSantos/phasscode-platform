name: Temporary PPKS v1.2 Prettier
on:
  push:
    branches: [dev]
    paths: [.github/workflows/temporary-ppks-v12-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format modified PPKS files
        run: npx prettier --write apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/adapters/ppks.ts apps/orbe-node/src/adapters/academic.ts tests/ppks-academic.test.ts knowledge/ppks/README.md
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/adapters/ppks.ts apps/orbe-node/src/adapters/academic.ts tests/ppks-academic.test.ts knowledge/ppks/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(ppks): format competency retrieval and experience adapter'
            git push origin HEAD:dev
          fi
