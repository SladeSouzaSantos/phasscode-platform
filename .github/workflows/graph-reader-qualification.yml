# One-time qualification runner for internal GraphRAG reader; remove after checked-in changes.
name: Graph reader qualification
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graph-reader-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format new isolated reader sources
        run: |
          npx prettier --write \
            apps/orbe-node/src/graph-reader/app.ts \
            apps/orbe-node/src/graph-reader/main.ts \
            tests/graph-reader-http.test.ts \
            compose.graphrag.reader.dev.yaml \
            docs/graph-rag-security-boundary.md
      - name: Lint, typecheck, build and focused tests
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run tests/graph-reader-http.test.ts tests/graph-public-policy.test.ts tests/grounded-recruiter-graph.test.ts
      - name: Commit qualified sources to dev
        run: |
          git add -- apps/orbe-node/src/graph-reader/app.ts apps/orbe-node/src/graph-reader/main.ts tests/graph-reader-http.test.ts compose.graphrag.reader.dev.yaml docs/graph-rag-security-boundary.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(graphrag): qualify internal graph reader (#29)'
            git push origin HEAD:dev
          fi
