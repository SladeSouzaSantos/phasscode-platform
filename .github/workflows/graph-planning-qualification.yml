# One-time DEV-only qualification: automated formatting plus offline tests.
# Retry with the invalid-field security test represented as runtime input.
# Delete immediately once the job is green; no remote deployment permitted.
name: Graph planning and evidence qualification
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graph-planning-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only changed F3.3 files
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/graph-transfer-planner.ts \
            apps/orbe-node/src/application/graph-vacancy-plan.ts \
            apps/orbe-node/src/application/graph-narrative-verifier.ts \
            apps/orbe-node/src/application/graph-recruiter-preview.ts \
            tests/graph-vacancy-transfer.test.ts \
            tests/graph-narrative-verifier.test.ts \
            docs/graph-rag-f3-3.md
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Graph/PPKS focused regression tests
        run: |
          npx vitest run \
            tests/graph-vacancy-transfer.test.ts \
            tests/graph-narrative-verifier.test.ts \
            tests/graph-professional-advocacy.test.ts \
            tests/graph-recruiter-preview.test.ts \
            tests/grounded-recruiter-graph.test.ts \
            tests/graph-reader-http-client.test.ts \
            tests/ppks-evidence-graph.test.ts
      - name: Save formatted files in dev only
        run: |
          git add -- \
            apps/orbe-node/src/application/graph-transfer-planner.ts \
            apps/orbe-node/src/application/graph-vacancy-plan.ts \
            apps/orbe-node/src/application/graph-narrative-verifier.ts \
            apps/orbe-node/src/application/graph-recruiter-preview.ts \
            tests/graph-vacancy-transfer.test.ts \
            tests/graph-narrative-verifier.test.ts \
            docs/graph-rag-f3-3.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(graphrag): qualify vacancy transfer and narrative proof (#30)'
            git push origin HEAD:dev
          fi
