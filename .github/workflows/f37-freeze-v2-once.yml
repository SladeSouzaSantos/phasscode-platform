name: F3.7 freeze second prospective v2 corpus (one-time)
on:
  push:
    branches: [dev]
    paths: [.github/workflows/f37-freeze-v2-once.yml]
permissions:
  contents: write
jobs:
  freeze:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with: { ref: dev, fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Format v2 before first model run, attest denominators and hash
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write evaluation/semantic-embedding-adversarial-v2.json
          node --input-type=commonjs <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const {execFileSync}=require('node:child_process');
          const path='evaluation/semantic-embedding-adversarial-v2.json';
          const buffer=fs.readFileSync(path);
          const data=JSON.parse(buffer);
          const known=new Set(
            ['projects','experiences'].flatMap(k=>require('./knowledge/ppks/index.json')[k].flatMap(x=>x.technologies||[]))
          );
          if (data.schemaVersion !== 'semantic-hybrid-corpus-v0' ||
              data.reviewStatus !== 'draft_not_human_approved' ||
              data.provenance !== 'synthetic_examples_only' ||
              data.cases?.length !== 40) throw Error('F37_V2_SCHEMA_OR_COUNT');
          const seen=new Set();
          const expected={paraphrase:0,literal:0,oov:0,nonreq:0,known:0};
          for(const c of data.cases){
            if(seen.has(c.id)||!['pt','en'].includes(c.language)||c.annotations.length!==1)
              throw Error('F37_V2_DUPLICATE_OR_INVALID');
            seen.add(c.id);
            const a=c.annotations[0];
            if(a.start!==0||a.end!==c.text.length||a.text!==c.text||a.candidateLabels.length!==1)
              throw Error('F37_V2_UNGROUNDED');
            if(c.id.includes('-para-'))expected.paraphrase++;
            if(c.id.includes('-lit-'))expected.literal++;
            if(c.id.includes('-oov-'))expected.oov++;
            if(c.id.includes('-nonreq-'))expected.nonreq++;
            if (a.role==='context'||a.role==='negated'){
              if(a.priority!=='none'||a.relation==='unrelated')throw Error('F37_V2_BAD_CONTROL');
            }else if(a.role==='mandatory'&&a.priority==='mandatory'&&a.relation==='candidate_requirement'){
              if(known.has(a.candidateLabels[0]))expected.known++;
            }else throw Error('F37_V2_BAD_MODALITY');
          }
          if(JSON.stringify(expected)!==JSON.stringify({paraphrase:20,literal:8,oov:8,nonreq:4,known:28}))
            throw Error('F37_V2_UNEXPECTED_COHORT '+JSON.stringify(expected));
          const manifest={
            schemaVersion:'semantic-adversarial-v2-manifest',
            fixture:path,
            sourceCorpusCommit:'51a19a52783da12fa35169459165666b9f357a21',
            frozenPolicyCommit:'8476d91f587c98a63ad9c716a25da360a6a47331',
            authoredAfterPolicyCommit:true,
            evaluatedByModel:false,
            humanReviewed:false,
            fixtureSha256:crypto.createHash('sha256').update(buffer).digest('hex'),
            fixtureGitBlob:execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim(),
            caseCount:40,inCatalogLabels:28,outOfCatalogLabels:8,
            contextNegatedControls:4,paraphrases:20,explicitLiterals:8,
            note:'Synthetic author-crafted holdout not independent human gold. Never tune policy on this v2 cohort or promote Shadow based on its result.'
          };
          fs.writeFileSync('evaluation/semantic-embedding-adversarial-v2.manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('F37_V2_FROZEN',JSON.stringify({sha:manifest.fixtureSha256,...expected}));
          NODE
          npx prettier --write evaluation/semantic-embedding-adversarial-v2.manifest.json
          npx prettier --check evaluation/semantic-embedding-adversarial-v2.json evaluation/semantic-embedding-adversarial-v2.manifest.json
          git diff --check
      - name: Publish frozen fixture + manifest on dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/semantic-embedding-adversarial-v2.json evaluation/semantic-embedding-adversarial-v2.manifest.json
          git commit -m 'test(F3.7): freeze second 40-case holdout and integrity hash before ONNX run (#41 #42)'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
