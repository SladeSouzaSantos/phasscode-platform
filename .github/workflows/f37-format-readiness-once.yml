name: F3.7 one-time readiness Prettier and full qualification
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-format-readiness-once.yml
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { ref: dev, fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Normalize only new Shadow readiness files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write apps/orbe-node/src/application/semantic-shadow-readiness.ts tests/semantic-shadow-readiness.test.ts
          git diff --check
      - name: Verify full lint, format, TypeScript, contracts, unit tests and build
        run: npm run check
      - name: Publish validated formatting to DEV only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbe-node/src/application/semantic-shadow-readiness.ts tests/semantic-shadow-readiness.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(F3.7): qualify fail-closed Shadow readiness gate (#44)'
            git fetch origin dev
            git rebase origin/dev
            git push origin HEAD:dev
          fi
