name: One-time F3.7 pinned ONNX CPU benchmark
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-embedding-onnx-lab-once.yml
permissions:
  contents: read
concurrency:
  group: f37-embedding-onnx-lab-once
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: npm ci --ignore-scripts
      - name: Validate schema, test runner and exporter without downloading model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_semantic_embedding_lab.py -v
          npm run typecheck
          npx vitest run \
            tests/semantic-skill-catalog.test.ts \
            tests/semantic-hybrid-lexical-baseline.test.ts \
            tests/semantic-hybrid-corpus.test.ts
      - name: Export read-only PPKS catalog and lexical reference
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/export-semantic-skill-catalog.ts > "$RUNNER_TEMP/catalog.json"
          node --import tsx scripts/evaluate-semantic-lexical.ts > "$RUNNER_TEMP/lexical.json"
          node --import tsx scripts/evaluate-semantic-lexical.ts --paraphrase-challenge > "$RUNNER_TEMP/lexical-challenge.json"
          node -e 'const c = require(process.env.RUNNER_TEMP + "/catalog.json"); if(c.skills.length < 1) process.exit(1); console.log("F37_CATALOG_EXPORT_SKILLS=" + c.skills.length)'
      - name: Download only the two pinned Hugging Face artifacts; enforce SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semantic-model"
          python3 scripts/semantic_embedding_lab.py prepare --model-dir "$RUNNER_TEMP/semantic-model" > "$RUNNER_TEMP/prepared.json"
          python3 scripts/semantic_embedding_lab.py verify --model-dir "$RUNNER_TEMP/semantic-model" > "$RUNNER_TEMP/verified.json"
          python3 - <<'PY'
          import json, os
          p = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "verified.json")))
          assert p["status"] == "EMBEDDING_ARTIFACTS_VERIFIED"
          assert len(p["modelRevision"]) == 40
          print("F37_MODEL_ARTIFACT_SHA256_VERIFIED")
          PY
      - name: Build isolated CPU image without model weights
        run: |
          docker build -f infrastructure/docker/Dockerfile.semantic-embedding-lab -t orbe-f37-onnx-lab:ephemeral .
      - name: Evaluate same synthetic spans with no network or app secrets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 2g --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/semantic-model,dst=/models,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/catalog.json,dst=/lab/catalog.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/lexical.json,dst=/lab/lexical.json,readonly" \
            orbe-f37-onnx-lab:ephemeral benchmark \
            --model-dir /models \
            --catalog /lab/catalog.json \
            --lexical-report /lab/lexical.json \
            > "$RUNNER_TEMP/embedding-report.json"
          python3 - <<'PY'
          import json, os
          p = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "embedding-report.json")))
          t = p["totals"]
          assert p["reportVersion"] == "semantic-embedding-onnx-lab-v1"
          assert t["cases"] == 16 and t["skills"] >= 1
          assert p["modelCalls"] == 0 and p["neo4jQueries"] == 0
          assert p["networkCallsDuringBenchmark"] == 0
          print("F37_EMBEDDING_OFFLINE_BENCHMARK_OK", json.dumps({
              "cases":t["cases"],"skills":t["skills"],
              "known":t["expectedInCatalog"],"oov":t["expectedOutOfCatalog"],
              "recallAt1":t["recallAt1"],"recallAt3":t["recallAt3"],
              "recallAt5":t["recallAt5"],"mrr":t["mrrFirstKnown"],
              "lexicalAt1":p["lexicalReference"]["recallAt1"],
              "rssMiB":p["resource"]["peakRssMiB"],
              "latencyMs":p["latencyMs"],
          }, separators=(",", ":")))
          PY
      - name: Benchmark provisional paraphrase challenge (no network)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 2g --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/semantic-model,dst=/models,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/catalog.json,dst=/lab/catalog.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/lexical-challenge.json,dst=/lab/lexical.json,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evaluation/semantic-embedding-paraphrase-v0.json,dst=/lab/challenge.json,readonly" \
            orbe-f37-onnx-lab:ephemeral benchmark \
            --model-dir /models \
            --catalog /lab/catalog.json \
            --corpus /lab/challenge.json \
            --lexical-report /lab/lexical.json \
            > "$RUNNER_TEMP/embedding-challenge-report.json"
          python3 - <<'PY'
          import json, os
          p = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "embedding-challenge-report.json")))
          t = p["totals"]
          assert t["cases"] == 18
          assert t["expectedInCatalog"] > 0
          assert p["lexicalReference"]["expectedInCatalog"] == t["expectedInCatalog"]
          assert p["networkCallsDuringBenchmark"] == 0
          print("F37_PARAPHRASE_CHALLENGE_OK", json.dumps({
              "cases":t["cases"],"known":t["expectedInCatalog"],"oov":t["expectedOutOfCatalog"],
              "recallAt1":t["recallAt1"],"recallAt3":t["recallAt3"],
              "recallAt5":t["recallAt5"],"mrr":t["mrrFirstKnown"],
              "lexicalAt1":p["lexicalReference"]["recallAt1"],
              "lexicalAt3":p["lexicalReference"]["recallAt3"],
              "top1Wrong":t["top1NotInExpectedLabel"],
              "rssMiB":p["resource"]["peakRssMiB"],
          }, separators=(",", ":")))
          PY
      - name: Upload only synthetic aggregate report (no model files)
        uses: actions/upload-artifact@v4
        with:
          name: f37-onnx-lab-aggregate
          path: |
            ${{ runner.temp }}/embedding-report.json
            ${{ runner.temp }}/embedding-challenge-report.json
          retention-days: 7
          if-no-files-found: error
