name: Orbe evidence last-mile formatter (one shot)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-lastmile-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format updated code and tests
        run: |
          npx prettier --write \
            knowledge/portfolio.json \
            apps/orbe-node/src/knowledge-matching.ts \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/prompts/v4.md \
            tests/evidence-packet.test.ts
      - name: Commit if formatting changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/portfolio.json apps/orbe-node/src/knowledge-matching.ts apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/prompts/v4.md tests/evidence-packet.test.ts
          git commit -m "style(ppks): format Git SQL testing evidence corrections"
          git push origin HEAD:dev
