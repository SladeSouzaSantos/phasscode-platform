name: Temporary Orbe final format and check
on:
  push:
    branches: [dev]
    paths: [.github/workflows/temporary-orbe-final-format-test.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format modified adapter
        run: npx prettier --write apps/orbe-node/src/application/chat.ts
      - name: Commit formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbe-node/src/application/chat.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(orbe): canonical formatter output for duration-context adapter'
            git push origin HEAD:dev
          fi
      - name: Validate complete repository
        run: npm run check
