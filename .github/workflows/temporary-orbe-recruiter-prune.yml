name: One-time cleanup of merged Orbe recruiter branch
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temporary-orbe-recruiter-prune.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo} = context.repo;
            const target = 'feat/orbe-recruiter-profile-sources-20261029';
            const expected = '554f7676c872226511c8dac61a98f052dfcb93ac';
            const pr = await github.rest.pulls.get({owner,repo,pull_number:19});
            if (!pr.data.merged || pr.data.base.ref !== 'dev' ||
                pr.data.head.sha !== expected) throw new Error('PR #19 not safely merged.');
            const {data:repoInfo} = await github.rest.repos.get({owner,repo});
            if (repoInfo.default_branch !== 'main') throw new Error('Unexpected default branch.');
            const {data:b} = await github.rest.repos.getBranch({owner,repo,branch:target});
            if (b.protected || b.commit.sha !== expected) throw new Error('Unexpected branch state.');
            const prs = await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
            if (prs.data.some(p=>p.head.ref===target)) throw new Error('Open PR uses branch.');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+target});
            core.info('Removed merged work branch; dev/main preserved.');
