name: F3.7 v2 one-time Prettier and full type checks
on:
  push:
    branches: [dev]
    paths: [.github/workflows/f37-format-v2-once.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with: { ref: dev, fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Format only v2 new docs and lexical CLI
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write scripts/evaluate-semantic-lexical.ts \
            docs/architecture/semantic-strict-fusion-v2.md \
            docs/architecture/minimac-f37-benchmark.md
          git diff --check
      - name: Full strict gates (lint, Prettier, types, contracts, tests, build)
        run: npm run check
      - name: Commit validated style-only changes to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evaluate-semantic-lexical.ts \
            docs/architecture/semantic-strict-fusion-v2.md \
            docs/architecture/minimac-f37-benchmark.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(F3.7): format strict v2 results and CLI after quality gates (#42)'
            git fetch origin dev
            git rebase origin/dev
            git push origin HEAD:dev
          fi
