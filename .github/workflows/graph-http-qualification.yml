# Temporary DEV-only formatter/qualifier. Remove immediately after completion.
name: Graph HTTP adapter qualification
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graph-http-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only newly added adapter, tests and docs
        run: |
          npx prettier --write \
            apps/orbe-node/src/adapters/graph-reader-http.ts \
            tests/graph-reader-http-client.test.ts \
            docs/graph-rag-f3-3.md
      - name: Type-check, lint and focused unit tests
        run: |
          npm run lint
          npm run typecheck
          npx vitest run tests/graph-reader-http-client.test.ts tests/graph-reader-http.test.ts tests/grounded-recruiter-graph.test.ts
      - name: Commit formatted code to existing dev branch
        run: |
          git add -- apps/orbe-node/src/adapters/graph-reader-http.ts tests/graph-reader-http-client.test.ts docs/graph-rag-f3-3.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(graphrag): format validated HTTP adapter (#30)'
            git push origin HEAD:dev
          fi
