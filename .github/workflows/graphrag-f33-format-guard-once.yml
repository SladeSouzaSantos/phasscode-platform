name: One-time GraphRAG F3.3 Prettier guard
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graphrag-f33-format-guard-once.yml
permissions:
  contents: write
jobs:
  format-guard:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply locked Prettier version to one source file
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write apps/orbe-node/src/application/graph-generated-prose-audit.ts
          git diff --check
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbe-node/src/application/graph-generated-prose-audit.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(graph): run locked Prettier on claim-audit fix (#31)'
            git push origin HEAD:dev
          fi
