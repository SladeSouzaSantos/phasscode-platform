name: F3.7 v2 policy-locked strict lexical vs ONNX (one-time)
on:
  push:
    branches: [dev]
    paths: [.github/workflows/f37-strict-v2-once.yml]
permissions:
  contents: read
concurrency:
  group: f37-strict-v2-once
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - name: Verify policy-first corpus freeze and safety tests, no model downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_f37_strict_literal.py -v
          python3 -m unittest discover -s tests -p test_f37_strict_v2.py -v
          python3 -m unittest discover -s tests -p test_f34_review_packet.py -v
          python3 scripts/validate_f34_review_packet.py > "$RUNNER_TEMP/reviewer-packet-status.json"
          git show 8476d91f587c98a63ad9c716a25da360a6a47331:scripts/f37_strict_literal.py > "$RUNNER_TEMP/frozen-policy.py"
          cmp "$RUNNER_TEMP/frozen-policy.py" scripts/f37_strict_literal.py
          python3 - <<'PY'
          import json,hashlib
          m=json.load(open('evaluation/semantic-embedding-adversarial-v2.manifest.json'))
          b=open(m['fixture'],'rb').read()
          assert hashlib.sha256(b).hexdigest()==m['fixtureSha256']
          assert m['frozenPolicyCommit']=='8476d91f587c98a63ad9c716a25da360a6a47331'
          assert not m['humanReviewed'] and not m['evaluatedByModel']
          assert (m['caseCount'],m['inCatalogLabels'],m['outOfCatalogLabels'],m['contextNegatedControls'])==(40,28,8,4)
          print('F37_V2_POLICY_AND_CORPUS_LOCKED')
          PY
      - name: Export public PPKS labels and v2 lexical baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --import tsx scripts/export-semantic-skill-catalog.ts > "$RUNNER_TEMP/catalog.json"
          node --import tsx scripts/evaluate-semantic-lexical.ts --adversarial-v2 > "$RUNNER_TEMP/lexical.json"
          python3 - <<'PY'
          import json,os
          root=os.environ['RUNNER_TEMP']
          c=json.load(open(root+'/catalog.json'))
          x=json.load(open(root+'/lexical.json'))['totals']
          assert len(c['skills'])==68 and (x['cases'],x['candidateSpans'],x['expectedInCatalog'],x['expectedOutOfCatalog'])==(40,36,28,8)
          print('F37_V2_LEXICAL_28_8_PAIRED')
          PY
      - name: Download only pinned ONNX and tokenizer weights and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semantic-model"
          python3 scripts/semantic_embedding_lab.py prepare --model-dir "$RUNNER_TEMP/semantic-model" > "$RUNNER_TEMP/model-preparation.json"
          python3 scripts/semantic_embedding_lab.py verify --model-dir "$RUNNER_TEMP/semantic-model" > "$RUNNER_TEMP/model-verification.json"
      - name: Build disposable CPU-only ONNX image without model weights
        run: docker build -f infrastructure/docker/Dockerfile.semantic-embedding-lab -t orbe-f37-onnx-v2:ephemeral .
      - name: Infer frozen v2 requirements in read-only OFFLINE container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cpus 2 --memory 2g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$RUNNER_TEMP/semantic-model,dst=/models,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/catalog.json,dst=/lab/catalog.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/lexical.json,dst=/lab/lexical.json,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evaluation/semantic-embedding-adversarial-v2.json,dst=/lab/corpus.json,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evaluation/semantic-skill-descriptions-v0.json,dst=/lab/descriptions.json,readonly" \
            orbe-f37-onnx-v2:ephemeral benchmark \
            --model-dir /models --catalog /lab/catalog.json --corpus /lab/corpus.json \
            --lexical-report /lab/lexical.json --descriptions /lab/descriptions.json \
            > "$RUNNER_TEMP/onnx-enriched-v2.json"
      - name: Evaluate 3 paired ranking policies and expose raw OOV risks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evaluate_f37_strict_v2.py \
            --catalog "$RUNNER_TEMP/catalog.json" \
            --onnx-report "$RUNNER_TEMP/onnx-enriched-v2.json" \
            --lexical-report "$RUNNER_TEMP/lexical.json" \
            > "$RUNNER_TEMP/strict-v2.json"
          python3 - <<'PY'
          import json,os
          root=os.environ['RUNNER_TEMP']
          result=json.load(open(root+'/strict-v2.json'))
          assert result['denominator']==dict(cases=40,candidateSpans=36,inCatalogLabels=28,outOfCatalogLabels=8,oracleQuarantinedContextOrNegation=4)
          assert result['risk']['autoVerifiedSkills']==0
          assert result['risk']['untrustedOovTop1Suggestions']==8
          assert result['policyLockedBeforeCorpus']=='8476d91f587c98a63ad9c716a25da360a6a47331'
          model=json.load(open(root+'/onnx-enriched-v2.json'))
          assert model['modelCalls']==model['neo4jQueries']==model['networkCallsDuringBenchmark']==0
          print('F37_STRICT_V2_PAIRED_RESULTS',json.dumps({
            'denominator':result['denominator'],
            'methods':result['methods'],
            'strictOverrides':result['strictOverrides'],
            'strictTop1Improvements':result['strictTop1Improvements'],
            'strictTop1Regressions':result['strictTop1Regressions'],
            'groups':result['groups'],
            'risk':result['risk'],
            'rssMiB':model['resource']['peakRssMiB'],
            'latencyMs':model['latencyMs'],
            'corpusSha256':result['corpusSha256']
          },separators=(',',':'),ensure_ascii=False))
          PY
      - name: Preserve synthetic diagnostic summaries only (no weights, visitor text, or secrets)
        uses: actions/upload-artifact@v7
        with:
          name: f37-v2-strict-literal-paired-synthetic
          path: |
            ${{ runner.temp }}/strict-v2.json
            ${{ runner.temp }}/reviewer-packet-status.json
          retention-days: 14
          if-no-files-found: error
