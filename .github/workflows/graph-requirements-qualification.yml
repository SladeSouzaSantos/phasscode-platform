# One-time formatter and focused validation, removed immediately after success.
name: Graph requirements offline qualification
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graph-requirements-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only new F3.3 code
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/graph-requirements.ts \
            apps/orbe-node/src/application/graph-recruiter-preview.ts \
            apps/orbe-node/src/application/grounded-recruiter-graph.ts \
            tests/graph-recruiter-preview.test.ts \
            docs/graph-rag-f3-3.md
      - name: Verify lint, typecheck and focused graph tests
        run: |
          npm run lint
          npm run typecheck
          npx vitest run tests/graph-recruiter-preview.test.ts tests/grounded-recruiter-graph.test.ts tests/graph-reader-http-client.test.ts
      - name: Commit formatting in dev
        run: |
          git add -- \
            apps/orbe-node/src/application/graph-requirements.ts \
            apps/orbe-node/src/application/graph-recruiter-preview.ts \
            apps/orbe-node/src/application/grounded-recruiter-graph.ts \
            tests/graph-recruiter-preview.test.ts \
            docs/graph-rag-f3-3.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(graphrag): qualify F3.3 requirement planner and fallback (#30)'
            git push origin HEAD:dev
          fi
