name: Register future HydraDB milestone (DEV one-time)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/plan-hydradb-milestone-dev.yml

permissions:
  contents: read
  issues: write

jobs:
  register-milestone:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create or reuse future milestone and attach F4 issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE='Orbe — Fase 4: HydraDB (PoC e benchmark pós-GraphRAG)'
          NUMBER=$(gh api "repos/${GH_REPO}/milestones?state=all&per_page=100" --jq '.[] | select(.title == "Orbe — Fase 4: HydraDB (PoC e benchmark pós-GraphRAG)") | .number' | head -n 1)
          if [ -z "$NUMBER" ]; then
            NUMBER=$(gh api --method POST "repos/${GH_REPO}/milestones" \
              -f title="$TITLE" -f state=open \
              -f description='Fase futura: avaliar HydraDB somente após homologação F3. PoC isolada MinIO, compatibilidade Cypher, benchmark e feedback sem migração automática.' \
              --jq '.number')
          fi
          test -n "$NUMBER"
          for ISSUE in 35 36 37 38 39; do
            gh api --method PATCH "repos/${GH_REPO}/issues/${ISSUE}" \
              -F milestone="$NUMBER" --jq '.milestone.number' | grep -qx "$NUMBER"
          done
          echo "HYDRADB_MILESTONE_OK number=${NUMBER} issues=35,36,37,38,39"
