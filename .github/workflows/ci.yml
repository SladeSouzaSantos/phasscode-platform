name: Backend CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:infrastructure
      - run: npm run smoke
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: |
            dist/
            packages/contracts/openapi.json
          retention-days: 7
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: phasscode_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d phasscode_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/phasscode_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:integration
  docker:
    runs-on: ubuntu-latest
    needs: [quality, integration]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: docker build -f infrastructure/docker/Dockerfile -t phasscode-platform:ci .
      - name: Validate Compose
        env: { POSTGRES_PASSWORD: ci-only }
        run: docker compose config --quiet
      - name: Smoke test complete environment
        env: { POSTGRES_PASSWORD: ci-only, LLM_PROVIDER: mock }
        run: |
          docker compose up -d --build --wait api
          curl --fail http://localhost:3000/ready
          curl --fail -H 'Content-Type: application/json' -d '{"message":"Quais projetos usam React?"}' http://localhost:3000/api/v1/chat
      - if: always()
        run: docker compose down --volumes
        env: { POSTGRES_PASSWORD: ci-only }
