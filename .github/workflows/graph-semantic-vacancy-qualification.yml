# One-time DEV-only qualification for budget-aware semantic label selection.
# Repeat after asserting SQL Server is retained instead of discarded.
# Remove after success; no API routes, secrets or remote deployment actions.
name: Graph semantic vacancy budget qualification
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graph-semantic-vacancy-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prettier on semantic F3.3 increment
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/graph-semantic-vacancy.ts \
            tests/graph-semantic-vacancy.test.ts \
            docs/graph-rag-f3-3.md
      - name: Check lint and TypeScript
        run: |
          npm run lint
          npm run typecheck
      - name: Test semantic selector, all graph gates, fallback and LLM controller
        run: |
          npx vitest run \
            tests/graph-semantic-vacancy.test.ts \
            tests/graph-vacancy-text.test.ts \
            tests/graph-vacancy-transfer.test.ts \
            tests/graph-narrative-verifier.test.ts \
            tests/graph-professional-advocacy.test.ts \
            tests/graph-recruiter-preview.test.ts \
            tests/grounded-recruiter-graph.test.ts \
            tests/graph-reader-http-client.test.ts \
            tests/ppks-evidence-graph.test.ts \
            tests/llm-fallback.test.ts \
            tests/llm-invocation-controller.test.ts
      - name: Save Prettier changes on dev only
        run: |
          git add -- \
            apps/orbe-node/src/application/graph-semantic-vacancy.ts \
            tests/graph-semantic-vacancy.test.ts \
            docs/graph-rag-f3-3.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(graphrag): qualify budgeted semantic vacancies (#30)'
            git push origin HEAD:dev
          fi
