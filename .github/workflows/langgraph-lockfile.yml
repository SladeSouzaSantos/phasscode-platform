# Temporary generator: official npm lockfile on a clean Node 24 runner.
# Remove this workflow when the generated lockfile is committed to dev.
name: LangGraph dependency lockfile candidate
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/langgraph-lockfile.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - name: Lock LangGraph 1.5.3 in existing Orbe workspace
        run: npm install --workspace @phasscode/orbe-node --save-exact @langchain/langgraph@1.5.3 --ignore-scripts --no-audit --no-fund
      - name: Verify official dependency lock with npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated package manifests to dev (only)
        run: |
          git add -- apps/orbe-node/package.json package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(orbe): lock LangGraph 1.5.3 dependency (#30)'
          git push origin HEAD:dev
      - uses: actions/upload-artifact@v7
        with:
          name: langgraph-1-5-3-lockfile
          path: |
            apps/orbe-node/package.json
            package-lock.json
          retention-days: 2
