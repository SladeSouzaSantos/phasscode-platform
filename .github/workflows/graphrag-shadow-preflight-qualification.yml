# One-time DEV-only qualification, rerun after fixture approval-state correction.
name: Qualify GraphRAG DEV shadow secrets and preflight
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graphrag-shadow-preflight-qualification.yml
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format scoped TS/YAML/docs
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/graph-reader-secret.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/main.ts \
            tests/graphrag-shadow-secret.test.ts \
            tests/graphrag-shadow-reader-network.test.ts \
            compose.graphrag.shadow.dev.yaml \
            docs/graph-rag-shadow-dev.md
      - name: Validate preflight, combined Compose and complete code quality
        run: |
          bash -n scripts/preflight-graphrag-shadow-dev.sh
          POSTGRES_PASSWORD=disposable-config-only           docker compose --project-name phasscode-platform-dev --env-file /dev/null             -f compose.yaml -f compose.graphrag.dev.yaml             -f compose.graphrag.reader.dev.yaml -f compose.graphrag.shadow.dev.yaml             --profile '*' config --quiet
          npm run check
          npm run test:infrastructure
          npx vitest run \
            tests/graphrag-shadow-secret.test.ts \
            tests/graphrag-shadow-reader-network.test.ts \
            tests/graphrag-shadow-http.test.ts
      - name: Commit formatting to DEV only
        run: |
          git add -- \
            apps/orbe-node/src/application/graph-reader-secret.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/main.ts \
            tests/graphrag-shadow-secret.test.ts \
            tests/graphrag-shadow-reader-network.test.ts \
            compose.graphrag.shadow.dev.yaml \
            docs/graph-rag-shadow-dev.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(graphrag): qualify DEV shadow preflight and network tests (#32)'
            git push origin HEAD:dev
          fi
