name: One-time F3.7 Laya paired benchmark 47 spans
on:
  push:
    branches: [dev]
    paths: [.github/workflows/f37-laya-paired-47-once.yml]
permissions:
  contents: read
concurrency:
  group: f37-laya-paired-47-once
  cancel-in-progress: false
jobs:
  laya-paired:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Frozen dataset integrity, pairwise evaluator and Laya contracts (no weights)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_semantic_typed_rules_lab.py -q
          python3 -m unittest discover -s tests -p test_compare_semantic_typed_lab.py -q
          python3 -m unittest discover -s tests -p test_laya_semantic_lab.py -q
          python3 scripts/compare_semantic_typed_lab.py > "$RUNNER_TEMP/rules-only.json"
          python3 scripts/laya_semantic_lab.py dry-run \
            --model-dir "$RUNNER_TEMP/unused" \
            --fixture evaluation/semantic-typed-holdout-v1.json --max-spans 47
      - name: Build disposable CPU-only Laya image (no weights)
        run: docker build -f infrastructure/docker/Dockerfile.semantic-laya-lab -t orbe-f37-laya-paired:ephemeral .
      - name: Explicitly download pinned checkpoint and verify weights/tokenizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/laya-paired-model"
          docker run --rm --cpus 2 --memory 5g \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HF_HOME=/models/.huggingface -e HOME=/tmp \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,src=$RUNNER_TEMP/laya-paired-model,dst=/models" \
            orbe-f37-laya-paired:ephemeral prepare --model-dir /models \
            > "$RUNNER_TEMP/laya-prepare.json"
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/laya-paired-model,dst=/models,readonly" \
            orbe-f37-laya-paired:ephemeral verify --model-dir /models \
            > "$RUNNER_TEMP/laya-verify.json"
          python3 - <<'PY'
          import os,json
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/laya-verify.json"))
          assert p["status"] == "LAYA_VERIFY_SHA256_OK" and len(p["checksums"])==2
          print("F37_LAYA_47_PINNED_HASHES_VERIFIED")
          PY
      - name: Reconcile known Laya tokenizer compatibility strictly offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cpus 2 --memory 5g \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HF_HOME=/tmp/hf -e HOME=/tmp -e XDG_CACHE_HOME=/tmp/cache \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            -e USE_TF=0 -e TOKENIZERS_PARALLELISM=false \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,src=$RUNNER_TEMP/laya-paired-model,dst=/models" \
            --entrypoint python orbe-f37-laya-paired:ephemeral \
            -c 'import laya; laya.load("/models", device="cpu"); print("F37_LAYA_47_TOKENIZER_RECONCILED_OFFLINE")'
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/laya-paired-model,dst=/models,readonly" \
            orbe-f37-laya-paired:ephemeral verify --model-dir /models \
            > "$RUNNER_TEMP/laya-after.json"
      - name: Infer 47 frozen synthetic spans OFFLINE with read-only model
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cpus 2 --memory 5g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HF_HOME=/tmp/hf -e HOME=/tmp -e XDG_CACHE_HOME=/tmp/cache \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            -e USE_TF=0 -e TOKENIZERS_PARALLELISM=false \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,src=$RUNNER_TEMP/laya-paired-model,dst=/models,readonly" \
            orbe-f37-laya-paired:ephemeral benchmark \
            --model-dir /models --fixture evaluation/semantic-typed-holdout-v1.json \
            --max-spans 47 > "$RUNNER_TEMP/laya-report.json"
      - name: Verify paired denominator, provenance and report only aggregate metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compare_semantic_typed_lab.py \
            --laya-report "$RUNNER_TEMP/laya-report.json" > "$RUNNER_TEMP/paired.json"
          python3 - <<'PY'
          import json,os
          base=os.environ["RUNNER_TEMP"]+"/"
          r=json.load(open(base+"paired.json"))
          l=json.load(open(base+"laya-report.json"))
          assert r["denominator"]==47 and r["rules"]["total"]==r["laya"]["total"]==47
          assert r["corpusSha256"]==l["fixtureSha256"]
          assert l["metrics"]["examples"]==47
          assert l["externalLlmCalls"]==l["graphQueries"]==l["networkCallsDuringBenchmark"]==0
          assert l["calibrationStatus"]=="UNCALIBRATED_NOT_APPROVED"
          print("F37_LAYA_PAIRED_47_METRICS",json.dumps({
            "n":r["denominator"],
            "rules":{k:r["rules"][k] for k in ("resolved","abstained","jointPrecisionAmongResolved","effectiveJointRecall","falseRequirementPromotions")},
            "laya":{k:r["laya"][k] for k in ("resolved","abstained","jointPrecisionAmongResolved","effectiveJointRecall","falseRequirementPromotions","negationPromotions")},
            "layaRoleAccuracy":l["metrics"]["roleAccuracy"],
            "layaRelationAccuracy":l["metrics"]["relationAccuracy"],
            "rssMiB":l["peakRssMiB"],
            "p95Ms":l["metrics"]["latencyMs"]["p95"],
            "calibration":l["calibrationStatus"],
            "corpusSha256":r["corpusSha256"],
          },ensure_ascii=False,separators=(",",":")))
          PY
      - name: Upload only synthetic aggregate reports (never weights or raw recruiter text)
        uses: actions/upload-artifact@v7
        with:
          name: f37-laya-paired-47-synthetic-reports
          path: |
            ${{ runner.temp }}/laya-report.json
            ${{ runner.temp }}/paired.json
            ${{ runner.temp }}/rules-only.json
          retention-days: 7
          if-no-files-found: error
