name: PPKS evidence format once
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ppks-evidence-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write \
            apps/orbe-node/src/application/evidence-packet.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            apps/orbe-node/src/domain/ports.ts \
            tests/evidence-packet.test.ts \
            tests/llm-adapter.test.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/application/evidence-packet.ts apps/orbe-node/src/application/chat.ts apps/orbe-node/src/adapters/langchain-provider.ts apps/orbe-node/src/domain/ports.ts tests/evidence-packet.test.ts tests/llm-adapter.test.ts
          git commit -m "style(ppks): format evidence packet and regression tests"
          git push origin HEAD:dev
