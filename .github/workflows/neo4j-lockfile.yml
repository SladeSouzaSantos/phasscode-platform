# Temporary one-shot generator for the exact npm lockfile on a clean Node 24 runner.
# Remove this workflow after committing the generated package-lock.json to dev.
name: Neo4j dependency lockfile candidate
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/neo4j-lockfile.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - name: Lock official Neo4j driver in workspace
        run: npm install --workspace @phasscode/orbe-node --save-exact neo4j-driver@6.2.0 --ignore-scripts
      - name: Verify lockfile using npm ci
        run: npm ci --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: neo4j-driver-6-2-lockfile
          path: |
            apps/orbe-node/package.json
            package-lock.json
          retention-days: 2
