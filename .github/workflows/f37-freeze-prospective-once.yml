name: F3.7 one-time prospective corpus freeze and format
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/f37-freeze-prospective-once.yml
permissions:
  contents: write
jobs:
  freeze:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { ref: dev, fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Format and freeze the prospective annotated cohort
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write evaluation/semantic-embedding-prospective-v1.json scripts/evaluate-semantic-lexical.ts
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const file='evaluation/semantic-embedding-prospective-v1.json';
          const bytes=fs.readFileSync(file);
          const data=JSON.parse(bytes.toString('utf8'));
          if (data.schemaVersion!=='semantic-hybrid-corpus-v0' ||
              data.provenance!=='synthetic_examples_only' ||
              data.reviewStatus!=='draft_not_human_approved' ||
              !data.purpose.includes('Prospective 44-case') ||
              data.cases.length!==44) throw Error('F37_UNEXPECTED_PROSPECTIVE_CORPUS');
          const known=new Set(require('./knowledge/ppks/index.json').projects.flatMap(x=>x.technologies).concat(
            require('./knowledge/ppks/index.json').experiences.flatMap(x=>x.technologies)));
          let positives=0,oov=0,quarantined=0;
          const ids=new Set();
          for (const c of data.cases) {
            if (ids.has(c.id)||!['pt','en'].includes(c.language)||c.annotations.length!==1) throw Error('F37_BAD_CASE');
            ids.add(c.id);
            const a=c.annotations[0];
            if (a.start!==0||a.end!==c.text.length||a.text!==c.text||a.candidateLabels.length!==1)
              throw Error('F37_BAD_OFFSETS');
            if (a.role==='context'||a.role==='negated'){quarantined++;continue;}
            for(const label of a.candidateLabels) known.has(label)?positives++:oov++;
          }
          if(positives!==34||oov!==6||quarantined!==4) throw Error('F37_UNEXPECTED_DENOMINATOR');
          const sha256=crypto.createHash('sha256').update(bytes).digest('hex');
          const gitBlobSha=execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim();
          const manifest={
            schemaVersion:'semantic-prospective-manifest-v1',
            fixture:file,
            authoredBeforeFirstModelRun:true,
            humanReviewed:false,
            scope:'synthetic_prospective_ranking_not_candidate_claims',
            sourceCommit:'7328928d6bf48b7bb5e599d04242f329f2ec9b89',
            sha256,gitBlobSha,
            caseCount:44,inCatalogLabels:34,outOfCatalogLabels:6,contextOrNegatedCases:4,
            rule:'No retuning to this fixture and no active/shadow promotion from this result.'
          };
          fs.writeFileSync('evaluation/semantic-embedding-prospective-v1.manifest.json',
            JSON.stringify(manifest,null,2)+'\n');
          console.log('F37_PROSPECTIVE_CORPUS_FROZEN cases=44 known=34 oov=6 quarantined=4 sha256='+sha256);
          NODE
          npx prettier --write evaluation/semantic-embedding-prospective-v1.manifest.json
          npx prettier --check evaluation/semantic-embedding-prospective-v1.json evaluation/semantic-embedding-prospective-v1.manifest.json scripts/evaluate-semantic-lexical.ts
          git diff --check
      - name: Publish only verified formatting and manifest to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/semantic-embedding-prospective-v1.json \
            evaluation/semantic-embedding-prospective-v1.manifest.json \
            scripts/evaluate-semantic-lexical.ts
          git diff --cached --quiet && exit 1
          git commit -m 'test(F3.7): freeze prospective 44-case ranking benchmark and sha256 (#41 #42)'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
