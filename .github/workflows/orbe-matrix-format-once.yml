name: Orbe matrix and output formatter (one shot)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-matrix-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write \
            packages/shared-config/src/index.ts \
            packages/contracts/src/index.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            apps/orbe-node/src/adapters/llm-model-factory.ts \
            apps/orbe-node/src/application/sources.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/application/recruiter-matrix.ts \
            tests/llm-adapter.test.ts \
            tests/recruiter-matrix.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-config/src/index.ts packages/contracts/src/index.ts apps/orbe-node/src/adapters/langchain-provider.ts apps/orbe-node/src/adapters/llm-model-factory.ts apps/orbe-node/src/application/sources.ts apps/orbe-node/src/application/chat.ts apps/orbe-node/src/application/recruiter-matrix.ts tests/llm-adapter.test.ts tests/recruiter-matrix.test.ts
          git commit -m "style(orbe): format configurable output and deterministic matrix"
          git push origin HEAD:dev
