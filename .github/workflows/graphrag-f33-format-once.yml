name: GraphRAG F3.3 formatting once (DEV)
on:
  push:
    branches: [dev]
    paths: [.github/workflows/graphrag-f33-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'SladeSouzaSantos/phasscode-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only F3.3 changed files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            apps/orbe-node/src/application/graph-active-answer.ts \
            apps/orbe-node/src/application/graph-generated-prose-audit.ts \
            apps/orbe-node/src/application/graph-narrative-verifier.ts \
            apps/orbe-node/src/application/graph-professional-advocacy.ts \
            apps/orbe-node/src/application/graph-recruiter-preview.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/main.ts \
            apps/orbe-node/src/domain/ports.ts \
            apps/orbe-node/src/http/app.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            tests/graph-generated-prose-audit.test.ts \
            tests/graph-narrative-verifier.test.ts \
            tests/graph-professional-advocacy.test.ts \
            tests/graphrag-active-http.test.ts
          git diff --check
      - name: Commit formatting to existing dev branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/orbe-node/src/application/graph-active-answer.ts \
            apps/orbe-node/src/application/graph-generated-prose-audit.ts \
            apps/orbe-node/src/application/graph-narrative-verifier.ts \
            apps/orbe-node/src/application/graph-professional-advocacy.ts \
            apps/orbe-node/src/application/graph-recruiter-preview.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/main.ts \
            apps/orbe-node/src/domain/ports.ts \
            apps/orbe-node/src/http/app.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            tests/graph-generated-prose-audit.test.ts \
            tests/graph-narrative-verifier.test.ts \
            tests/graph-professional-advocacy.test.ts \
            tests/graphrag-active-http.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(graphrag): format F3.3 semantic and factual verification'
            git push origin HEAD:dev
          fi
