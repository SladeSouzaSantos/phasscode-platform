name: Orbe PPKS one-shot formatter
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/orbe-ppks-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format modified PPKS source and regressions
        run: |
          npx prettier --write \
            apps/orbe-node/src/adapters/knowledge.ts \
            apps/orbe-node/src/adapters/langchain-provider.ts \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/application/evidence-packet.ts \
            apps/orbe-node/src/application/sources.ts \
            tests/evidence-packet.test.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PHASSCODE Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orbe-node/src/adapters/knowledge.ts apps/orbe-node/src/adapters/langchain-provider.ts apps/orbe-node/src/application/chat.ts apps/orbe-node/src/application/evidence-packet.ts apps/orbe-node/src/application/sources.ts tests/evidence-packet.test.ts
          git commit -m "style(ppks): apply Prettier to recruiter evidence coverage"
          git push origin HEAD:dev
