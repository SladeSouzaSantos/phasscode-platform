name: GraphRAG F3.3 one-time formatting (DEV)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/graphrag-f3-3-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only F3.3 changed files
        run: |
          npx prettier --write \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/application/graph-active-answer.ts \
            apps/orbe-node/src/application/graph-recruiter-preview.ts \
            docs/graph-rag-active-dev.md \
            tests/graphrag-active-http.test.ts \
            tests/graphrag-shadow-secret.test.ts
      - name: Commit formatting (DEV only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/orbe-node/src/application/chat.ts \
            apps/orbe-node/src/application/graph-active-answer.ts \
            apps/orbe-node/src/application/graph-recruiter-preview.ts \
            docs/graph-rag-active-dev.md \
            tests/graphrag-active-http.test.ts \
            tests/graphrag-shadow-secret.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(graph): format F3.3 active graph implementation"
            git push origin HEAD:dev
          fi
